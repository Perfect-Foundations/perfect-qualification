[package]
name = "perfect-rational-candidate-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Isolated candidate consumer. Must not mix with Float/Decimal on Rational main.
[features]
default = ["std"]
std = ["perfect-rational/std", "perfect-arithmetic/std", "perfect-numeric/std", "perfect-float/std", "perfect-decimal/std"]

[dependencies]
perfect-rational = { git = "https://github.com/Perfect-Foundations/perfect-rational.git", rev = "857c55beee5aeb381c674d739630b8c3407fa7f8", version = "=0.1.0", default-features = false }
perfect-arithmetic = { git = "https://github.com/Perfect-Foundations/perfect-arithmetic.git", rev = "95e8499f458d9cb681ce0d452cade1cd17c9f6ad", version = "=0.1.0", default-features = false }
perfect-numeric = { git = "https://github.com/Perfect-Foundations/perfect-numeric.git", rev = "19b6747cd852a47a694a020b97ba70b6b3ef259b", version = "=0.1.0", default-features = false }
perfect-float = { git = "https://github.com/Perfect-Foundations/perfect-float.git", rev = "194887d5fa2959ce758160de3354376b1a4baaee", version = "=0.1.0", default-features = false }
perfect-decimal = { git = "https://github.com/Perfect-Foundations/perfect-decimal.git", rev = "f75df906f3ab83aa5ddb8eb94328c146a96a11f6", version = "=0.1.0", default-features = false }

[dev-dependencies]
num-bigint = "=0.4.8"
num-rational = "=0.4.2"