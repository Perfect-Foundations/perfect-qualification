[package]
name = "qualify-perfect-finance"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["std"]
std = ["perfect-finance/std", "perfect-decimal/std", "perfect-rational/std", "perfect-arithmetic/std", "perfect-numeric/std"]

[dependencies]
perfect-finance = { git = "https://github.com/Perfect-Foundations/perfect-finance.git", rev = "63f704c68e1567991979fff1061266946285d153", version = "=0.1.0", default-features = false }
