[package]
name = "qualify-perfect-units"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["std"]
std = ["perfect-units/std", "perfect-rational/std", "perfect-arithmetic/std", "perfect-numeric/std"]

[dependencies]
perfect-units = { git = "https://github.com/Perfect-Foundations/perfect-units.git", rev = "2fead7599f0f44dbc3ea7612c9b1db32330d8852", version = "=0.1.0", default-features = false }
perfect-rational = { git = "https://github.com/Perfect-Foundations/perfect-rational.git", rev = "97cce0ae8ff7ef206929d273e1d4a5774f6a2a34", version = "=0.1.0", default-features = false }
perfect-arithmetic = { git = "https://github.com/Perfect-Foundations/perfect-arithmetic.git", rev = "1a54d3c7cbbae4e73325cc70fd2777a2427b1504", version = "=0.1.0", default-features = false }
perfect-numeric = { git = "https://github.com/Perfect-Foundations/perfect-numeric.git", rev = "19b6747cd852a47a694a020b97ba70b6b3ef259b", version = "=0.1.0", default-features = false }
