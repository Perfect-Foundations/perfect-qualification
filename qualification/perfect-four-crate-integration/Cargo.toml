[package]
name = "perfect-four-crate-integration"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["std"]
std = ["perfect-numeric/std", "perfect-arithmetic/std", "perfect-rational/std", "perfect-float/std", "perfect-decimal/std"]

[dependencies]
perfect-numeric = { git = "https://github.com/Perfect-Foundations/perfect-numeric.git", rev = "19b6747cd852a47a694a020b97ba70b6b3ef259b", version = "=0.1.0", default-features = false }
perfect-arithmetic = { git = "https://github.com/Perfect-Foundations/perfect-arithmetic.git", rev = "95e8499f458d9cb681ce0d452cade1cd17c9f6ad", version = "=0.1.0", default-features = false }
perfect-rational = { git = "https://github.com/Perfect-Foundations/perfect-rational.git", rev = "21a7fba5f22ab7f5db12b480a1c910edd1797d77", version = "=0.1.0", default-features = false }
perfect-float = { git = "https://github.com/Perfect-Foundations/perfect-float.git", rev = "e46b68ed20ec232be08e6c9f968ab2bc85db0736", version = "=0.1.0", default-features = false }
perfect-decimal = { git = "https://github.com/Perfect-Foundations/perfect-decimal.git", rev = "0b4766a015706bcb77c1c54d2ed3a552e3e8f933", version = "=0.1.0", default-features = false }
