[package]
name = "qualify-perfect-algebra"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["std"]
std = ["perfect-algebra/std", "perfect-number-theory/std", "perfect-arithmetic/std", "perfect-numeric/std"]

[dependencies]
perfect-algebra = { git = "https://github.com/Perfect-Foundations/perfect-algebra.git", rev = "da90fb38b1491aac8caf8600c0943d5a3bab388c", version = "=0.1.0", default-features = false }
perfect-number-theory = { git = "https://github.com/Perfect-Foundations/perfect-number-theory.git", rev = "2bdd2eee53615acb5beac8720c1d2be62120c080", version = "=0.1.0", default-features = false }
perfect-arithmetic = { git = "https://github.com/Perfect-Foundations/perfect-arithmetic.git", rev = "9ec660f9abfd7fe93e441e77dbb1158c371603f5", version = "=0.1.0", default-features = false }
perfect-numeric = { git = "https://github.com/Perfect-Foundations/perfect-numeric.git", rev = "19b6747cd852a47a694a020b97ba70b6b3ef259b", version = "=0.1.0", default-features = false }
