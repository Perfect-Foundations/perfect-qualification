      - name: Retain Q6 qualification state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q6-job-state-${{ format('class-b-{0}', matrix.target) }}
          path: q6-job-state/${{ format('class-b-{0}', matrix.target) }}.json
          if-no-files-found: error

  report:
    name: Q6 / Qualification report
    if: ${{ always() }}
    needs:
      - quality
      - performance
      - fuzz
      - mutation
      - class-a
      - class-b
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target status
        id: target-status
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Perfect-Foundations/perfect-arithmetic
          ref: ${{ inputs.source_ref }}
          path: .report-target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact qualification report renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qualification-suite
          fetch-depth: 1
          persist-credentials: false

      - name: Download Q6 qualification-state artifacts
        id: job-states
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: q6-job-state-*
          path: q6-job-state
          merge-multiple: true

      - name: Generate exact Q6 qualification report
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_REPOSITORY: Perfect-Foundations/perfect-arithmetic
          TARGET_SHA: ${{ inputs.source_ref }}
          QUALIFICATION_REPOSITORY: ${{ job.workflow_repository }}
          QUALIFICATION_SHA: ${{ job.workflow_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_STATUS_CHECKOUT: ${{ steps.target-status.outcome }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 .qualification-suite/qualification/perfect-arithmetic/scripts/render_q6_report.py \
            --target-root .report-target \
            --state-root q6-job-state

      - name: Retain overall Q6 qualification report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q6-qualification-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            q6-qualification-report.md
            q6-qualification-report.json
          if-no-files-found: error
