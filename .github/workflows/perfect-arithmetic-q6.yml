          sed -i.bak \
            "s|perfect-numeric = { git = \"https://github.com/Perfect-Foundations/perfect-numeric.git\", rev = \"$PERFECT_NUMERIC_REV\", version = \"=0.1.0\", default-features = false }|perfect-numeric = { path = \"$PERFECT_NUMERIC_PATH\", version = \"=0.1.0\", default-features = false }|" \
            .qualified-source/Cargo.toml
          rm .qualified-source/Cargo.toml.bak
          test -f "$CANDIDATE_LOCK"
          cp "$CANDIDATE_LOCK" .qualified-source/Cargo.lock
          cmp "$CANDIDATE_LOCK" .qualified-source/Cargo.lock

      - name: Install pinned mutation toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          cargo install cargo-mutants --version =27.1.0 --locked

      - name: Mark Q6 mutation evidence phase
        shell: bash
        run: |
          set -euo pipefail
          touch .q6-evidence-started

      - name: Validate candidate mutation reachability
        working-directory: .qualified-source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .cargo/mutants.toml
          test ! -e mutants.toml
          if grep -R -nE 'mutants[[:space:]]*::[[:space:]]*(skip|exclude_re)' src; then
            echo "Q6 FAIL: candidate production source suppresses cargo-mutants coverage"
            exit 1
          fi

          cargo metadata --locked --all-features --format-version 1 >/dev/null
          cargo mutants --all-features --list --no-config --exclude-re 'tests::' > ../q6-mutants.txt
          mutant_count="$(grep -cve '^[[:space:]]*$' ../q6-mutants.txt)"
          if [ "$mutant_count" -lt 80 ]; then
            echo "Q6 FAIL: mutation inventory shrank below retained M5 floor (80): $mutant_count"
            exit 1
          fi
          echo "Q6 mutation inventory: $mutant_count"
          cmp "../$CANDIDATE_LOCK" Cargo.lock

      - name: Re-run production mutation campaign on exact Q6 candidate
        working-directory: .qualified-source
        run: |
          cargo mutants --all-features --jobs 2 --timeout 90 --build-timeout 180 --no-shuffle --no-config --exclude-re 'tests::'
          cmp "../$CANDIDATE_LOCK" Cargo.lock


      - name: Record Q6 qualification state
        if: ${{ always() }}
        shell: bash
        env:
          Q6_JOB_KEY: mutation
          Q6_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p q6-job-state
          state=FAIL
          failure_present=false
          if [ -f .q6-failed ]; then
            failure_present=true
          fi
          if [ -f .q6-blocked ]; then
            state=BLOCKED
          elif [ ! -f .q6-evidence-started ]; then
            state=BLOCKED
          elif [ "$Q6_JOB_STATUS" = "success" ]; then
            state=PASS
          else
            failure_present=true
          fi
          printf '{"job_key":"%s","state":"%s","failure_present":%s}\n' \
            "$Q6_JOB_KEY" "$state" "$failure_present" > "q6-job-state/$Q6_JOB_KEY.json"

      - name: Retain Q6 qualification state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q6-job-state-mutation
          path: q6-job-state/mutation.json
