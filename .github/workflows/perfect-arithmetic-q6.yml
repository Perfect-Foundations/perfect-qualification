    name: Q6 / Candidate-bound mutation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Perfect Arithmetic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
